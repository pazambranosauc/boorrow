<title>Boorrow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Creepster&display=swap">
<style>
/* Layout: a real website. Sticky top bar with section pills, wide browse grid on desktop, one column on phones.
   Brand: Halloween night, orange only for BOO, the main button and pumpkins. Seasons swap the tokens below. */
:root {
  --night: #120B1F; --night-2: #1A1129; --card: #241838; --card-2: #2D1F49; --line: #3A2A55;
  --ghost: #F4EEFF; --mist: #B3A6D1; --accent: #FF7A1A; --ink: #1A0A02; --candle: #FFC94D;
  --money: #9EE35A; --violet: #8B5CF6; --lav: #B9A6F2; --danger: #FF9A8A; --grave: #08040F;
  --moon-a: #FFF8E4; --moon-b: #F2BE62; --moon-glow: 255,150,60; --sky-top: #0D0817; --sky-bot: #1B0F2B; --glow: #3B2160;
  --f-logo: "Creepster", "Bricolage Grotesque", system-ui, sans-serif;
  --f-ui: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
  color-scheme: dark;
}
:root[data-season="muertos"] {
  --night: #130F2A; --night-2: #1B1538; --card: #261D4D; --card-2: #2F2560; --line: #403270;
  --accent: #FFA928; --ink: #1E1002; --candle: #FFD166; --money: #7EE0B5; --violet: #E0559E; --lav: #F2A6D2;
  --grave: #0A0720; --moon-a: #FFE9B0; --moon-b: #FFA928; --moon-glow: 255,169,40; --sky-top: #0C0920; --sky-bot: #231246; --glow: #4B1F6B;
}
:root[data-season="navidad"] {
  --night: #0D1B17; --night-2: #12251F; --card: #1A3029; --card-2: #213B33; --line: #2F4F45;
  --accent: #FF6A5E; --ink: #1F0604; --candle: #FFD36B; --money: #A5F0A0; --violet: #5BC0A0; --lav: #A9E5CF;
  --grave: #06100D; --moon-a: #F4FBFF; --moon-b: #BFD9EC; --moon-glow: 170,210,240; --sky-top: #07110E; --sky-bot: #12302A; --glow: #1B4A3D;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ghost); font-family: var(--f-ui); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--candle); }
:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- sky ---------- */
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  background: radial-gradient(120% 70% at 85% -10%, var(--glow) 0%, transparent 60%), linear-gradient(180deg, var(--sky-top) 0%, var(--night) 55%, var(--sky-bot) 100%); }
.stars { position: absolute; inset: 0; }
.moon { position: absolute; top: -50px; right: -30px; width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, var(--moon-a) 0%, var(--moon-b) 100%);
  box-shadow: 0 0 80px 30px rgba(var(--moon-glow), .18), 0 0 160px 80px rgba(var(--moon-glow), .08); opacity: .9; }
.moon::before, .moon::after { content: ""; position: absolute; border-radius: 50%; background: rgba(160,120,60,.28); }
.moon::before { width: 36px; height: 36px; left: 52px; top: 82px; }
.moon::after { width: 20px; height: 20px; left: 108px; top: 124px; }
.bat { position: absolute; width: 34px; color: #07040C; animation: flap 3.2s ease-in-out infinite; }
.bat svg { width: 100%; height: auto; display: block; }
.bat.b1 { top: 96px; right: 160px; } .bat.b2 { top: 160px; right: 52px; width: 24px; animation-delay: -1.1s; } .bat.b3 { top: 50px; right: 240px; width: 20px; animation-delay: -2s; }
:root:not([data-season="halloween"]) .bat { display: none; }
.papel { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: none;
  background: repeating-linear-gradient(90deg, #FF5FA2 0 36px, #FFB020 36px 72px, #5BC8FF 72px 108px, #9EE35A 108px 144px, #B07CFF 144px 180px);
  -webkit-mask: linear-gradient(#000 0 0) top / 100% 10px no-repeat, repeating-linear-gradient(90deg, #000 0 26px, transparent 26px 36px) bottom / 100% 34px no-repeat;
  mask: linear-gradient(#000 0 0) top / 100% 10px no-repeat, repeating-linear-gradient(90deg, #000 0 26px, transparent 26px 36px) bottom / 100% 34px no-repeat; opacity: .55; }
:root[data-season="muertos"] .papel { display: block; }
@keyframes flap { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(5deg); } }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--night) 90%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; }
.logo { font-family: var(--f-logo); font-size: 38px; line-height: 1; letter-spacing: 1px; color: var(--ghost); text-shadow: 0 0 18px rgba(255,122,26,.3); margin-right: auto; }
.logo .boo { color: var(--accent); }
.seasonbox { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mist); }
.seasonbox select { background: var(--night-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.proto { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mist); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; width: 100%; padding-bottom: 2px; }
.nav::-webkit-scrollbar { display: none; }
.navbtn { flex: none; display: inline-flex; align-items: center; gap: 7px; background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; color: var(--mist); }
.navbtn svg { width: 17px; height: 17px; }
.navbtn:hover { color: var(--ghost); }
.navbtn[aria-current="page"] { background: var(--ghost); color: var(--night); }
.navbtn.cta { background: var(--accent); color: var(--ink); }
.navbtn.cta[aria-current="page"] { outline: 2px solid var(--ghost); }
.cnt { background: var(--candle); color: var(--night); font-size: 11px; font-weight: 800; border-radius: 999px; min-width: 18px; padding: 1px 6px; text-align: center; }

main { position: relative; z-index: 1; padding-block: 20px 28px; }
.where { display: flex; align-items: center; gap: 6px; color: var(--mist); font-size: 13px; }
.where svg { width: 14px; color: var(--accent); }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: 1fr; gap: 22px; padding-block: 18px 6px; }
@media (min-width: 860px) { .hero { grid-template-columns: 1.1fr .9fr; align-items: end; gap: 40px; padding-block: 34px 10px; } }
.hero h2 { font-size: clamp(32px, 6.4vw, 54px); line-height: 1.02; font-weight: 800; letter-spacing: -.025em; text-wrap: balance; margin: 8px 0 10px; }
.hero h2 em { font-style: normal; color: var(--candle); }
.hero p { color: var(--mist); max-width: 44ch; font-size: 16px; }
.steps { display: grid; gap: 10px; counter-reset: s; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.step::before { counter-increment: s; content: counter(s); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--violet); color: #fff; font-weight: 800; font-size: 14px; }
.step b { display: block; font-size: 15px; }
.step span { color: var(--mist); font-size: 13px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--mist); font-size: 13px; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); }
.facts span { display: inline-flex; align-items: center; gap: 6px; }
.facts svg { width: 15px; height: 15px; color: var(--money); }

/* ---------- browse tools ---------- */
.tools { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 22px; }
@media (min-width: 700px) { .tools { grid-template-columns: 1fr auto auto; } }
.search { display: flex; align-items: center; gap: 10px; background: var(--night-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; height: 46px; min-width: 0; }
.search svg { width: 16px; color: var(--mist); flex: none; }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; height: 100%; }
.search input::placeholder { color: var(--mist); }
.sel { background: var(--night-2); border: 1px solid var(--line); border-radius: 999px; height: 46px; padding: 0 14px; min-width: 0; }
.selrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 700px) { .selrow { display: contents; } }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--mist); }
.chip svg { width: 13px; height: 13px; }
.chip small { font-weight: 600; opacity: .8; }
.chip[aria-pressed="true"] { background: var(--ghost); color: var(--night); border-color: var(--ghost); }
.chip.locked { border-style: dashed; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; margin-top: 14px; }
.card { text-align: left; background: var(--card); border: 1px solid transparent; border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; transition: transform .15s ease, border-color .15s ease; min-width: 0; }
.card:hover { transform: translateY(-2px); border-color: var(--line); }
.tile { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 12px; display: grid; place-items: center; overflow: hidden; }
.tile > svg { width: 58%; height: auto; color: var(--ghost); filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.badges { position: absolute; left: 8px; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.badge { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: rgba(18,11,31,.78); color: var(--ghost); }
.badge.hot { background: var(--candle); color: var(--night); }
.badge.orig { background: var(--violet); color: #fff; }
.card h3 { font-size: 15px; font-weight: 600; line-height: 1.2; }
.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 12px; color: var(--mist); }
.price { color: var(--ghost); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.price small { font-weight: 400; color: var(--mist); font-size: 12px; }
.stars-r { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--candle); }
.stars-r svg { width: 12px; height: 12px; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--mist); padding: 40px 10px; }

.sec { margin-top: 34px; }
.sec-title { font-size: clamp(24px, 4vw, 32px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.sec-sub { color: var(--mist); margin-top: 6px; max-width: 62ch; }
.subhead { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mist); margin: 28px 0 0; }
.soon { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
.soonc { text-align: left; background: transparent; border: 1.5px dashed var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; min-width: 0; }
.soonc:hover { border-color: var(--lav); }
.soonc b { font-size: 16px; display: flex; align-items: center; gap: 8px; }
.soonc b svg { width: 16px; color: var(--lav); }
.soonc span { color: var(--mist); font-size: 13px; }
.meter { height: 8px; border-radius: 999px; background: var(--night-2); border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--w, 0%); background: linear-gradient(90deg, var(--violet), var(--candle)); }
.panel { margin-top: 16px; background: var(--card); border: 1.5px dashed var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; }
.panel h3 { font-size: 22px; font-weight: 800; }
.panel p { color: var(--mist); max-width: 60ch; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- forms ---------- */
.formgrid { display: grid; grid-template-columns: 1fr; gap: 0 36px; margin-top: 18px; }
@media (min-width: 860px) { .formgrid { grid-template-columns: 1fr 1fr; align-items: start; } }
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; min-width: 0; }
.field > label, .field > .lab, .lab { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mist); }
.text { background: var(--night-2); border: 1px solid var(--line); border-radius: 12px; height: 48px; padding: 0 14px; outline: none; width: 100%; min-width: 0; }
.text:focus { border-color: var(--candle); }
textarea.text { height: auto; padding: 12px 14px; min-height: 84px; resize: vertical; }
.photo { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border: 1.5px dashed var(--line); border-radius: var(--r); display: grid; place-items: center; text-align: center; color: var(--mist); background: var(--night-2); overflow: hidden; cursor: pointer; }
.photo svg { width: 28px; color: var(--accent); margin-bottom: 6px; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.range { width: 100%; accent-color: var(--accent); }
.keepbox { background: var(--card); border-radius: 14px; padding: 14px; display: grid; gap: 4px; }
.keepbox strong { font-size: 24px; color: var(--money); font-variant-numeric: tabular-nums; }
.keepbox span { color: var(--mist); font-size: 13px; }
.err { color: var(--danger); font-size: 13px; min-height: 1.2em; margin: -6px 0 10px; }
.hint { color: var(--mist); font-size: 13px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--mist); }
.check input { margin-top: 3px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 26px; border: 0; border-radius: 999px; background: var(--accent); color: var(--ink); font-weight: 800; font-size: 16px; width: 100%; }
.btn:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghosty { background: transparent; color: var(--ghost); border: 1px solid var(--line); }
.btn.small { min-height: 40px; padding: 0 16px; font-size: 14px; width: auto; }
.btn.money { background: var(--money); color: #0B1A04; }
.btn svg { width: 17px; height: 17px; }
.link { background: none; border: 0; color: var(--candle); text-decoration: underline; padding: 0; font-size: 13px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--card-2); font-size: 18px; font-weight: 800; }
.stepper output { min-width: 34px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }

/* ---------- wanted / groups ---------- */
.reqs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 16px; }
.req { background: var(--card); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.req h3 { font-size: 17px; font-weight: 600; }
.req .meta { flex-wrap: wrap; justify-content: flex-start; gap: 4px 14px; }
.asks { color: var(--candle); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.quote { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; }
.quote .ln { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; font-size: 14px; }
.quote .ln span { color: var(--mist); }
.quote .tot { border-top: 1px solid var(--line); padding-top: 10px; font-size: 17px; font-weight: 800; }
.quote .us { color: var(--candle); font-size: 13px; }

/* ---------- my closet ---------- */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; background: linear-gradient(135deg, var(--card-2), var(--night-2)); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin-top: 18px; }
.summary div { display: grid; gap: 2px; align-content: start; }
.summary b { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.summary b.money { color: var(--money); }
.summary span { font-size: 12px; color: var(--mist); }
.list { display: grid; gap: 10px; margin-top: 12px; }
@media (min-width: 900px) { .list.two { grid-template-columns: 1fr 1fr; } }
.item { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; background: var(--card); border-radius: 14px; padding: 10px; min-width: 0; }
.item .tile { width: 64px; border-radius: 10px; }
.item .tile > svg { width: 62%; }
.item .body { min-width: 0; display: grid; gap: 8px; }
.item b { font-weight: 600; }
.item .sub { font-size: 13px; color: var(--mist); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; border-radius: 999px; padding: 3px 9px; background: var(--card-2); color: var(--lav); }
.pill.ok { background: rgba(158,227,90,.14); color: var(--money); }
.pill.warn { background: rgba(255,201,77,.14); color: var(--candle); }
.pill.bad { background: rgba(255,154,138,.14); color: var(--danger); }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.track i { display: grid; gap: 4px; justify-items: center; font-style: normal; font-size: 10.5px; color: var(--mist); text-align: center; line-height: 1.15; }
.track i::before { content: ""; width: 100%; height: 5px; border-radius: 99px; background: var(--line); }
.track i.on { color: var(--ghost); }
.track i.on::before { background: var(--money); }
.track i.now::before { background: var(--candle); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.demo { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--lav); }

/* ---------- business ---------- */
.bizgrid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 18px; }
@media (min-width: 900px) { .bizgrid { grid-template-columns: 1fr 1fr; align-items: start; } }
.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.box h3 { font-size: 18px; font-weight: 800; }
.bars { display: grid; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 110px 1fr 64px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row > span:first-child { color: var(--mist); }
.bar-row .t { height: 14px; border-radius: 7px; background: var(--night-2); overflow: hidden; }
.bar-row .t i { display: block; height: 100%; width: var(--w, 0%); border-radius: 7px; background: var(--lav); }
.bar-row .t i.g { background: var(--money); } .bar-row .t i.o { background: var(--accent); } .bar-row .t i.r { background: var(--danger); }
.bar-row output { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.big { margin-top: 8px; font-size: 34px; font-weight: 800; color: var(--money); font-variant-numeric: tabular-nums; line-height: 1; }
.big small { font-size: 13px; font-weight: 400; color: var(--mist); display: block; margin-top: 4px; }
.twin { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 460px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mist); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
.tbl td.n, .tbl th.n { text-align: right; }
.tbl tr.sum td { font-weight: 800; border-bottom: 0; color: var(--money); }
.switch { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.switch button { width: 52px; height: 30px; border-radius: 999px; border: 0; background: var(--line); position: relative; flex: none; }

/* ---------- money logic ---------- */
function deposit(retail) { const v = Math.min(retail, CFG.cap); return Math.max(CFG.depositMin, Math.round(v * CFG.depositPct / 5) * 5); }
function rentalOf(price, days) { return price * (1 + CFG.extraDay * (days - 1)); }
function unit(price, days, prot, kit, orig) {
  const rental = rentalOf(price, days), protAmt = prot ? CFG.protect : 0, charged = rental + protAmt;
  const owner = orig ? 0 : rental * (1 - CFG.fee), comm = rental - owner, gross = comm + protAmt;
  const card = charged * CFG.cardPct + CFG.cardFix;
  return { rental, protAmt, charged, owner, comm, gross, card, kit: kit || 0, net: gross - card - (kit || 0) };
}
function settle(b) {
  const dep = deposit(b.retail), lateN = Math.min(b.late, CFG.lostDays), late = lateN * CFG.lateFee;
  let toOwner, cost = 0, refund;
  if (b.lost) { const pay = Math.min(b.retail, CFG.cap); toOwner = pay; cost = Math.max(0, pay - dep); refund = 0; }
  else { const cover = b.protect ? Math.min(b.damage, CFG.cover) : 0; const fromDep = Math.min(dep, late + b.damage - cover); cost = cover; refund = dep - fromDep; toOwner = fromDep + cover; }
  return { dep, late, toOwner, refund, cost };
}

function sheetNudge() {
  sheet.label = 'Nov 1 nudge';
  return '<div class="kicker">Sent to every renter on Nov 1</div><h3 style="margin-top:6px">That costume is about to go in a closet for a year.</h3><div class="sub">Next season, someone wants it. List it now and earn from it.</div><div class="done">' + PUMPKIN_SM.replace('width="96" height="96"', 'class="floaty" width="96" height="96"') + '<p>Your Halloween rental history gets you a one-tap listing: photos, size and a suggested price are filled in.</p></div><div class="stack"><button class="btn" data-act="nav" data-v="list">List it now</button></div>';
}
function sheetDone() {
  sheet.label = 'Request sent';
  return '<div class="done"><div class="floaty">' + cos('ghost') + '</div><h3>Request sent</h3><p>' + esc(sheet.msg) + '</p></div><div class="stack"><button class="btn" data-act="booking" data-id="' + sheet.id + '">Open booking and chat</button></div>';
}

/* ---------- render ---------- */
function render() {
  applySeason(); renderNav();
  $('#view').innerHTML = V[S.view]();
  save();
}
function go(v) { S.view = v; closeSheet(); render(); window.scrollTo(0, 0); }

/* ---------- actions ---------- */
const A = {
  nav(el) { go(el.dataset.v); },
  cat(el) { S.cat = el.dataset.c; render(); },
  open(el) { ck = { days: 1, pick: 0, prot: true, agree: false }; openSheet({ type: 'listing', id: el.dataset.id }); },
  close() { closeSheet(); },
  scrim(el, e) { if (e.target === el) closeSheet(); },
  pick(el) { ck.pick = +el.dataset.i; sheet.noFocus = 1; drawSheet(); },
  cdays(el) { ck.days = Math.max(1, Math.min(7, ck.days + +el.dataset.d)); sheet.noFocus = 1; drawSheet(); },
  book() {
    const it = itemById(sheet.id), pk = SEAS[S.season].pick[ck.pick], id = 'b' + (S.nid++);
    S.bookings.unshift({ id, role: 'renter', who: it.o, name: it.n, i: it.i, h: it.h, price: it.p, retail: it.r, days: ck.days, pick: pk, protect: ck.prot, status: 'requested', late: 0, lost: 0, damage: 0, photos: [false, false], rating: 0, result: null, orig: it.orig ? 1 : 0, msgs: [{ f: 'sys', t: 'Request sent. ' + it.o + ' usually answers within a few hours.' }] });
    save(); renderNav();
    openSheet({ type: 'done', id, msg: it.o + ' has your request for ' + pk + '. You are charged only if they accept.' });
  },
  booking(el) { openSheet({ type: 'booking', id: el.dataset.id }); },
  photo(el) { const b = bk(); b.photos[+el.dataset.i] = true; save(); sheet.noFocus = 1; drawSheet(); },
  late() { const b = bk(); b.late = Math.min(CFG.lostDays, b.late + 1); save(); sheet.noFocus = 1; drawSheet(); },
  lost() { const b = bk(); b.lost = 1; finish(b); },
  dmg(el) { bk().damage = +el.dataset.v; sheet.noFocus = 1; drawSheet(); },
  adv() {
    const b = bk(), i = STATUS.indexOf(b.status);
    if (b.status === 'returned') { finish(b); return; }
    b.status = STATUS[i + 1];
    const say = { confirmed: 'Request accepted. Agree on a public pickup spot here.', picked: 'Handoff photos saved for both of you. Return window: 48 hours after the event.', returned: 'Returned. Owner has 48 hours to inspect.' }[b.status];
    if (say) b.msgs.push({ f: 'sys', t: say });
    save(); renderNav(); sheet.noFocus = 1; drawSheet();
  },
  rate(el) { bk().rating = +el.dataset.n; save(); sheet.noFocus = 1; drawSheet(); },
  qr(el) { sendMsg(el.dataset.t); },
  chatform(el, e) { e.preventDefault(); const i = $('#cmsg'); if (i && i.value.trim()) sendMsg(i.value.trim()); },
  soon(el) { openSheet({ type: 'soon', k: el.dataset.k }); },
  preview(el) { S.season = el.dataset.k; S.cat = 'All'; buildSeasonSelect(); go('browse'); },
  notify(el) { S.notify[el.dataset.k] = !S.notify[el.dataset.k]; toast(S.notify[el.dataset.k] ? 'We’ll message you when it opens.' : 'Notification off.'); if (sheet) { drawSheet(); } render(); },
  nudge() { openSheet({ type: 'nudge' }); },
  metoo(el) { const w = S.wanted.find(x => x.id === el.dataset.id); if (S.meToo[w.id]) return; S.meToo[w.id] = 1; w.asks++; toast(w.asks >= 3 ? 'Owners with a close match were nudged.' : 'Added. Owners will see the demand.'); render(); },
  have(el) { const w = S.wanted.find(x => x.id === el.dataset.id); pdraft = Object.assign({}, pdraft, { n: w.n, price: String(w.budget), retail: String(Math.round(w.budget / CFG.suggestPct)) }); go('list'); },
  'post-wanted'() {
    const n = $('#wn').value.trim(), by = $('#wb').value.trim(), p = parseFloat($('#wp').value);
    if (!n) { $('#werr').textContent = 'Say what you need.'; return; }
    S.wanted.unshift({ id: 'w' + (S.nid++), n, who: 'You', seas: SEAS[S.season].name, by: by || 'Soon', budget: p > 0 ? p : 20, asks: 1 }); S.meToo[S.wanted[0].id] = 1;
    toast('Posted. Owners will see it.'); render();
  },
  gn(el) { S.grp.n = Math.max(2, Math.min(60, S.grp.n + +el.dataset.d)); render(); },
  gd(el) { S.grp.days = Math.max(1, Math.min(7, S.grp.days + +el.dataset.d)); render(); },
  'quote-req'() { toast('Quote requested. A real person would reply in a day.'); },
  partner() { S.partner = true; toast('Bulk-listing sheet requested.'); render(); },
  publish() {
    const d = pdraft, r = parseFloat(d.retail), p = parseFloat(d.price), e = $('#lerr');
    if (!d.n.trim()) { e.textContent = 'Give it a name.'; return; }
    if (!(r > 0)) { e.textContent = 'Add what it cost you.'; return; }
    if (!(p > 0)) { e.textContent = 'Set a price per day.'; return; }
    if (!d.ok) { e.textContent = 'Confirm the cleaning and handoff promise.'; return; }
    const seas = d.c === 'Navidad' ? ['navidad'] : d.c === 'Día de Muertos' ? ['halloween', 'muertos'] : ['halloween'];
    const icon = { 'Witches & wizards': 'hat', 'Monsters & undead': 'skull', 'Royalty & fantasy': 'crown', Kids: 'wings', Pets: 'pumpkin', 'Couples & groups': 'cape', 'Día de Muertos': 'dress', Navidad: 'santa' }[d.c];
    S.mine.unshift({ id: 'm' + (S.nid++), n: d.n.trim(), c: d.c, s: d.s, p, r, o: 'You', a: 'Your neighborhood', rt: 0, rv: 0, i: icon, h: 285, seas, d: .5, desc: 'Listed by you.', photo: d.photo, f: d.feat ? 1 : 0, mine: 1 });
    pdraft = { price: '', retail: '', feat: false, ok: false, photo: '', n: '', c: 'Witches & wizards', s: 'M' };
    toast('Listed. It shows up in Browse now.'); go('closet');
  },
  feature(el) { const it = S.mine.find(x => x.id === el.dataset.id); it.f = it.f ? 0 : 1; render(); },
  unlist(el) { S.mine = S.mine.filter(x => x.id !== el.dataset.id); render(); },
  bswitch(el) { const k = el.dataset.k; S.biz[k] = !S.biz[k]; render(); },
  preset(el) { const P = { low: [80, 1.2], base: [250, 2], high: [800, 2.8] }[el.dataset.k]; S.biz.preset = el.dataset.k; S.biz.L = P[0]; S.biz.per = P[1]; render(); },
  reset() { S = seedState(); S.view = 'biz'; buildSeasonSelect(); toast('Demo reset.'); render(); }
};
function bk() { return S.bookings.find(x => x.id === sheet.id); }
function finish(b) {
  const r = settle(b); b.result = r; b.status = 'settled';
  const u = unit(b.price, b.days, b.protect, 0, b.orig);
  S.ledger.push({ id: b.id, name: b.name, orig: b.orig, rental: u.rental, comm: u.comm, prot: u.protAmt, card: u.card, cost: r.cost });
  b.msgs.push({ f: 'sys', t: b.lost ? 'Marked lost. Deposit goes to the owner.' : 'Settled. Deposit released.' });
  save(); renderNav(); sheet.noFocus = 1; drawSheet(); toast(b.lost ? 'Marked lost.' : 'Rental settled. See it in Business.');
}
function sendMsg(t) {
  const b = bk(), id = b.id;
  b.msgs.push({ f: 'me', t });
  if (/venmo|zelle|cash ?app|paypal|cash\b|efectivo|wire|transfer|pay me|p[aá]game/i.test(t)) {
    b.msgs.push({ f: 'sys', t: 'Heads up: the deposit, photos and protection only cover payments made in Boorrow. Keep it in the app.' });
  } else {
    setTimeout(() => { const x = S.bookings.find(y => y.id === id); if (!x) return; x.msgs.push({ f: 'them', t: /where|meet/i.test(t) ? 'The library lot on Thursday works. I’ll bring it in a garment bag.' : 'Yes, it’s available! Message me with any questions.' }); save(); if (sheet && sheet.type === 'booking' && sheet.id === id) { sheet.noFocus = 1; drawSheet(); const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight; } }, 700);
  }
  save(); sheet.noFocus = 1; drawSheet(); const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight; const i = $('#cmsg'); if (i) i.focus();
}
function resizePhoto(file, cb) {
  const fr = new FileReader();
  fr.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, 480 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .7)); }; im.src = fr.result; };
  fr.readAsDataURL(file);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'FORM') return;
  const f = A[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('submit', e => { const el = e.target.closest('[data-act]'); if (el && A[el.dataset.act]) A[el.dataset.act](el, e); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; $('#grid').innerHTML = gridHtml(); save(); return; }
  const k = t.dataset.in; if (!k) return;
  if (k === 'biz') {
    const key = t.dataset.k, v = parseFloat(t.value); S.biz[key] = v;
    $$('[data-val="' + key + '"]').forEach(s => { s.textContent = t.dataset.u === '$' ? '$' + v : t.dataset.u === '%' ? v + '%' : v; });
    $('#unitout').innerHTML = unitOut(); $('#scnout').innerHTML = scnOut(); S.biz.preset = ''; save(); return;
  }
  const d = pdraft;
  if (k === 'lname') d.n = t.value; else if (k === 'lretail') { d.retail = t.value; $('#listout').innerHTML = listOut(); } else if (k === 'lprice') { d.price = t.value; $('#listout').innerHTML = listOut(); } else if (k === 'photo' && t.files && t.files[0]) resizePhoto(t.files[0], url => { d.photo = url; render(); });
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'season') { S.season = t.value; S.cat = 'All'; render(); return; }
  if (t.id === 'size') { S.size = t.value; $('#grid').innerHTML = gridHtml(); save(); return; }
  if (t.id === 'sort') { S.sort = t.value; $('#grid').innerHTML = gridHtml(); save(); return; }
  const k = t.dataset.in; if (!k) return;
  if (k === 'cprot') { ck.prot = t.checked; sheet.noFocus = 1; drawSheet(); }
  else if (k === 'cagree') { ck.agree = t.checked; sheet.noFocus = 1; drawSheet(); }
  else if (k === 'gtype') { S.grp.type = t.value; save(); }
  else if (k === 'gtier') { S.grp.tier = +t.value; render(); }
  else if (k === 'gprot') { S.grp.prot = t.checked; render(); }
  else if (k === 'lcat') pdraft.c = t.value;
  else if (k === 'lsize') pdraft.s = t.value;
  else if (k === 'lfeat') pdraft.feat = t.checked;
  else if (k === 'lok') pdraft.ok = t.checked;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheet) { closeSheet(); return; }
  if (e.key === 'Tab' && sheet) {
    const sh = $('#layer .sheet'); if (!sh) return;
    const f = $$('button:not([disabled]),input,select,summary,a[href]', sh); if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

buildSeasonSelect();
render();
window.__boorrow = { S: () => S, A, go };
})();
</script>
